        isValidToken: "true"
        expectedStatusCode: "400"
        expectedMessageId: "errors.upload.format"
        expectedTable: "1"
        expectedSearch: ""
        forwardUri: "/WEB-INF/view/projectUpload/create.jsp"
      - no: "4"
        description: "フォーマットが不正な行がある場合（囲み文字が不正）"
        context: "userContext"
        isValidToken: "true"
        expectedStatusCode: "400"
        expectedMessageId: "errors.upload.format"
        expectedTable: "1"
        expectedSearch: ""
        forwardUri: "/WEB-INF/view/projectUpload/create.jsp"
