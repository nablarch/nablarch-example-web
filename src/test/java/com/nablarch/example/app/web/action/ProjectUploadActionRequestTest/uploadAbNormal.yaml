list_maps:
  - id: "testShots"
    rows:
      - no: "1"
        description: "バリデーションエラー発生"
        context: "userContext"
        isValidToken: "true"
        expectedStatusCode: "400"
        expectedMessageId: "errors.upload.validate"
        expectedTable: "1"
        expectedSearch: ""
        forwardUri: "/WEB-INF/view/projectUpload/create.jsp"
      - no: "2"
        description: "二重サブミットエラー発生"
        context: "userContext"
        isValidToken: "false"
        expectedStatusCode: "400"
