list_maps:
  - id: "charsetAndLength"
    rows:
      - propertyName: "projectName"
        allowEmpty: "x"
        min: ""
        max: "64"
        messageIdWhenInvalidLength: "{domainType.projectName.message}"
        messageIdWhenNotApplicable: "{domainType.projectName.message}"
        半角英字: "x"
        半角数字: "x"
        半角記号: "x"
        半角カナ: "x"
        全角英字: "o"
        全角数字: "o"
        全角ひらがな: "o"
        全角カタカナ: "o"
        全角漢字: "o"
        全角記号その他: "o"
        外字: "o"
        中国語: "x"
        サロゲートペア: "x"
        改行: "x"
